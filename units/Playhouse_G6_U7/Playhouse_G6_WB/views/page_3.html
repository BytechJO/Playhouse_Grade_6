<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="X-UA-Compatible"
        content="ie=edge"
    >

    <title>
        Playhouse
    </title>

    <!-- =========================================
         General CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../css/jquery-ui.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/bootstrap/bootstrap.css"
    >

    <style id="ui_style"></style>

    <link
        rel="stylesheet"
        href="../css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/unit_styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/draw.css"
    >

    <link
        rel="stylesheet"
        href="../css/audio.css"
    >

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/activities.css"
    >

    <!-- =========================================
         Activity CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../css/conversation_change.css"
    >

    <!-- =========================================
         General JavaScript Libraries
    ========================================== -->

    <script
        src="../js/jquery-3.4.1.min.js"
        type="text/javascript">
    </script>

    <script
        src="../js/jquery-ui.min.js"
        type="text/javascript">
    </script>

    <script
        src="../js/bootstrap/bootstrap.bundle.min.js"
        type="text/javascript">
    </script>

    <script
        src="../js/jquery.ui.touch-punch.min.js"
        type="text/javascript">
    </script>

    <script
        src="../js/all.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Header and Footer Data
    ========================================== -->

    <script
        src="../js/data/templateData.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Activity List
    ========================================== -->

    <script
        src="../js/data/activityList.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         JSON Renderer
    ========================================== -->

    <script
        src="../js/build/jsonRender.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Activity Data
    ========================================== -->

    <script
        src="../js/data/conversation_change_data.js"
        type="text/javascript">
    </script>

    <!-- اختياري، فقط إذا النشاط يستخدم popup -->
    <!--
    <script
        src="../js/data/popupData.js"
        type="text/javascript">
    </script>
    -->

</head>

<body>

    <!-- =========================================
         Side Masks
    ========================================== -->

    <div class="mask_parent">
        <div class="mask_left"></div>
        <div class="mask_right"></div>
    </div>

    <!-- =========================================
         Loading
    ========================================== -->

    <div class="loading">
        <div class="loader"></div>
    </div>

    <!-- =========================================
         Header
    ========================================== -->

    <header class="fixed-top"></header>

    <!-- =========================================
         Main Content
    ========================================== -->

    <div class="mainContent">

        <!-- موجود لأن المشروع العام يعتمد عليه،
             لكن النشاط الجديد لا يستخدم Check Answer -->
        <div
            id="feedbackPopup"
            class="modal fade"
            role="dialog"
        >
            <div
                class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
            >
                <div class="modal-content">

                    <div>
                        <button
                            type="button"
                            class="close closeFeedback"
                            data-dismiss="modal"
                        >
                            &times;
                        </button>
                    </div>

                    <div class="modal-body">

                        <video
                            id="video_1"
                            src="../videos/goodjob.mp4"
                            preload>
                        </video>

                        <video
                            id="video_2"
                            src="../videos/tryagain.mp4"
                            preload>
                        </video>

                    </div>

                </div>
            </div>
        </div>

        <div class="container content_wrap activity_wrap">

            <!-- =========================================
                 Screen Numbering
            ========================================== -->

            <div class="fixed-top screen_numbers_wrap"></div>

            <!-- =========================================
                 Activity Panel Content
            ========================================== -->

            <div
                class="activity_buts d-none"
                data-buttons="ccss,link,tips,homework"
            >

                <div
                    class="ccss_content"
                    data-height=""
                >
                    L.1.1 d
                </div>

                <div
                    class="link_content"
                    data-height=""
                >
                    <a
                        href="../../../ARC_1_1_SB/ARC_1_1_SB_U3/index.html"
                        target="blank"
                    >
                        Playhouse Unit 3 – All Aboard!
                    </a>
                </div>

                <div
                    class="tips_content"
                    data-height=""
                >
                    <span class="pop_title">
                        Conversation Practice
                    </span>

                    <br>

                    Click the underlined words and write new words
                    to change the conversation.
                </div>

                <div
                    class="homework_content"
                    data-height=""
                >
                    Have your child practise the conversation
                    using different words.
                </div>

            </div>

            <!-- =========================================
                 Activity Area
            ========================================== -->

            <div
                class="activity_area conversation_change"
                data-activity="conversationChange"
            >
            </div>

        </div>

    </div>

    <!-- =========================================
         Activity Control Panel
    ========================================== -->

    <div
        class="modal fade activityCtrlPanel"
        tabindex="-1"
        role="dialog"
        aria-hidden="true"
    >
        <div
            class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
        >
            <div class="modal-content">

                <div class="modal-header">

                    <div class="ctrlIcon"></div>

                    <h4 class="modal-title"></h4>

                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                    >
                        &times;
                    </button>

                </div>

                <div class="modal-body"></div>

            </div>
        </div>
    </div>

    <!-- =========================================
         Sub Footer
    ========================================== -->

    <div class="sub_footer">

        <div class="container sub_footer_buttons_wrap"></div>

    </div>

    <!-- =========================================
         Footer
    ========================================== -->

    <footer class="fixed-bottom"></footer>

    <!-- =========================================
         Media List
    ========================================== -->

    <script>
        var _mediaList = {
            image: [],
            audio: [],
            video: []
        };
    </script>

    <!-- =========================================
         General Build Files
    ========================================== -->

    <script
        src="../js/build/toolbar.js"
        type="text/javascript">
    </script>

    <script
        src="../js/build/template.js"
        type="text/javascript">
    </script>

    <script
        src="../js/audioControls.js"
        type="text/javascript">
    </script>

    <script
        src="../js/build/audio.js"
        type="text/javascript">
    </script>

    <script
        src="../js/build/radio_build.js"
        type="text/javascript">
    </script>

    <script
        src="../js/generalfunctions.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Activity Build
    ========================================== -->

    <script
        src="../js/build/conversation_change_build.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Activity Logic
    ========================================== -->

    <script
        src="../js/activity/conversation_change_activity.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Main Activity Controller
    ========================================== -->

    <script
        src="../js/activities.js"
        type="text/javascript">
    </script>

    <!-- =========================================
         Loading / Sketchpad
    ========================================== -->

    <script
        src="../js/loading.js"
        type="text/javascript">
    </script>

    <script
        src="../js/sketchpad.js"
        type="text/javascript">
    </script>

</body>

</html>

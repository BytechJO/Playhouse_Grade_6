<html>
<head>
    <link rel="stylesheet" href="../css/jquery-ui.min.css">
    <link rel="stylesheet" href="../css/bootstrap/bootstrap.css"> 
    <style id='ui_style'>
    </style>  
    <link rel="stylesheet" href="../css/all.min.css">  
    <link rel="stylesheet" href="../css/unit_styles.css">	
    
    <link rel="stylesheet" href="../css/styles.css"> 
    <link rel="stylesheet" href="../css/activities.css">
    <link rel="stylesheet" href="../css/audio.css">

    <script src="../js/jquery-3.4.1.min.js" type="text/javascript"></script>    
    <script src="../js/jquery-ui.min.js" type="text/javascript"></script>
    <script src="../js/bootstrap/bootstrap.bundle.min.js" type="text/javascript"></script>
    <script src="../js/jquery.ui.touch-punch.min.js" text="text/javascript"></script> 

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js" text="text/javascript"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js" text="text/javascript"></script> 
    <script src="https://cdn.rawgit.com/angeal185/angeal185.github.io/28f5fec1/controllers/jsonRender.js"></script>
</head>
<body>

    <div class="sterio">
        <div class="top">
            <div class="sterio_hand"></div>
        </div>
        <div class="right">
            <div class="right_div"></div>
        </div>

        <div class="player d-flex flex-column">
            <div class="controls">
                <i class="rew fa fa-backward controls_back"></i>
                <i class="fwd fa fa-forward controls_forward"></i>
                <span class="demo_Btn1"></span>
                <!-- <i class="fa fa-volume-up vol-icn"></i> -->
                <div class="volume">
                    <i class="fa fa-exchange track-icn"></i>
                </div>
                <span class="demo_Btn2"></span>
            </div>
            <div class="tracker track_control"></div>
            <div class="body_btns">
                <span class="demo_Btn3"></span>
                <span class="left_Btn"></span>
                <span class="center_box_control">
                    <span class="top_body">
                        <span class="tape">
                            <span class="tape_circle1"></span>
                            <span class="tape_rect"></span>
                            <span class="tape_circle2"></span>
                        </span>
                    </span>
                    <div class="internal_controls">
                        <i class="play fa fa-play"></i> 
                        <i class="pause fa fa-pause"></i>
                        <i class="restart fa fa-refresh" ></i>
                    </div>
                </span>
                <span class="right_Btn"></span>
                <span class="demo_Btn4"></span>
            </div>
          </div>
        </div>
        <div class="play-item">
          <ul class="playlist"></ul>
        </div>
      </div>

      <script src="../js/build/audio.js"></script>
      
</body>
</html>
